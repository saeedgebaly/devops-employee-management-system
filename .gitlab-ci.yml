stages:
  - test
  - build
  - docker

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

test:
  stage: test
  tags:
    - docker
  script:
    - echo "Testing..."
    - cd app
    - chmod +x mvnw
    - ./mvnw test

build:
  stage: build
  tags:
    - docker
  script:
    - echo "Building..."
    - cd app
    - chmod +x mvnw
    - ./mvnw clean package -DskipTests
  artifacts:
    paths:
      - app/target/*.jar
    expire_in: 1 hour

docker:
  stage: docker
  tags:
    - docker
  script:
    - echo "Building Docker image..."
    - docker build \
      -t saeedgebaly/employee-management:$CI_COMMIT_SHORT_SHA \
      -t saeedgebaly/employee-management:latest \
      app
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    - docker push saeedgebaly/employee-management:$CI_COMMIT_SHORT_SHA
    - docker push saeedgebaly/employee-management:latest
