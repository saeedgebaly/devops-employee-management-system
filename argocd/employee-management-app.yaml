apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: employee-management
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.com/saeedgebaly7/devops-employee-management-system.git
    targetRevision: develop
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
